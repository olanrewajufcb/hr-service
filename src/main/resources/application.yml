spring:
  application:
    name: hr-service

  r2dbc:
    username: hr_user
    password: ${hr_DB_PASSWORD:hr_pwd}
    properties:
      schema: hr_schema
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/emis_db?schema=hr_schema
    pool:
      max-create-connection-time: 2s
      initial-size: 5
      max-size: 10

  flyway:
    user: hr_user
    password: ${FLYWAY_DB_PASSWORD:hr_pwd}
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/emis_db
    default-schema: hr_schema
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  cloud:
    stream:
      defaultBinder: kafka
      bindings:
        hrEvents-out-0:
          destination: hr.events.v1
          content-type: application/json
          producer:
            error-channel-enabled: true

        reportProcessor-in-0:
          destination: hr.events.v1
          group: hr-report-processor
          content-type: application/json

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/emis

      client:
        registration:
          hr-service:
            client-id: emis-hr-service
            client-secret: ${HR_SERVICE_SECRET:hr-service-secret}
            authorization-grant-type: client_credentials
            scope: openid
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/emis
  lifecycle:
    timeout-per-shutdown-phase: 15s


server:
  port: 8085
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 15s


springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"


emis:
  services:
    school-service-properties:
      base-url: ${EMIS_SERVICE_URL:http://localhost:8082}
      get-school-details-url: ${emis.services.school-service-properties.base-url}/api/v1/schools/{schoolCode}

    academic-service-properties:
      base-url: ${EMIS_SERVICE_URL:http://localhost:8084}
      get-class-section-url: ${emis.services.academic-service-properties.base-url}/api/v1/academic/schools/{schoolCode}/classes/{classId}/sections/{sectionId}


    timeout: 5

    school-attendance-configuration:
         check-in-time: "08:00:00"
         cut-off-time: "10:30:00"

    storage-base-url: ${EMIS_STORAGE_URL:http://localhost:8086/reports}


    actions:
      create-resource:
        roles:
          - SCHOOL_ADMIN
      view-resource:
        roles:
          - SYSTEM_ADMIN
          - STATE_ADMIN
          - SCHOOL_ADMIN
          - SCHOOL_TEACHER
          - STUDENT
          - PARENT
      restricted-resource:
        roles:
          - SYSTEM_ADMIN
          - STATE_ADMIN
          - LGA_ADMIN
          - SCHOOL_ADMIN

      strictly-restricted-resource:
        roles:
          - SYSTEM_ADMIN
          - STATE_ADMIN
          - LGA_ADMIN
      teacher-resource:
        roles:
          - SCHOOL_TEACHER

        service-authorities:
          - INTERNAL_SERVICE


logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
    org.springframework.http.converter: DEBUG
    org.springframework.validation: DEBUG
    org.springframework.web.reactive.result.method.annotation: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    org.flywaydb: DEBUG




